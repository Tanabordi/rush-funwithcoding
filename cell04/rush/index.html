<!DOCTYPE html>
<!-- ============================================================================
     index.html  |  Rush - Fun With Coding  |  42Bangkok
     ผู้จัดทำ : phuwprak, tanboonp

     หน้าที่ของไฟล์นี้ :
       หน้าแรก (หน้าสารบัญ) ของเว็บไซต์แฟ้มสะสมผลงาน
       แสดงการ์ดของสมาชิก 2 คน พร้อมปุ่มกดเข้าไปดูแฟ้มสะสมผลงานรายบุคคล
       ออกแบบให้ "จบในหน้าจอเดียว เลื่อนไม่ได้"
       ผู้ใช้จึงเห็นทางเลือกทั้งหมดทันทีโดยไม่ต้องเลื่อนหา

     ไฟล์ที่เกี่ยวข้อง :
       style.css       สไตล์ที่เขียนเอง (ใช้ร่วมกันทุกหน้า)
       phuwprak.html   ปลายทางของปุ่มบนการ์ดใบที่ 1
       tanboonp.html   ปลายทางของปุ่มบนการ์ดใบที่ 2

     โครงสร้างของหน้า :
       บล็อกที่ 1  ข้อความต้อนรับ
       บล็อกที่ 2  การ์ดสมาชิก 2 ใบ (col-md-5 + col-md-5)
     ============================================================================ -->

<!-- DOCTYPE (บรรทัดที่ 1) : ประกาศว่าเอกสารนี้เป็น HTML5
     ต้องเป็นสิ่งแรกสุดของเอกสารเสมอ
     ถ้าไม่ใส่ เบราว์เซอร์จะเข้าสู่ Quirks Mode ซึ่งคำนวณขนาดกล่องผิดจากมาตรฐาน
     ทำให้ Bootstrap แสดงผลเพี้ยน

     lang="th" : บอกว่าเนื้อหาหลักเป็นภาษาไทย มีผลต่อการตัดคำของเบราว์เซอร์
     การอ่านออกเสียงของโปรแกรมอ่านหน้าจอ และการเสนอแปลภาษาอัตโนมัติ -->

<html lang="th">
<head>
    <!-- charset="UTF-8" : สำคัญมากสำหรับภาษาไทย
         กำหนดการเข้ารหัสอักขระเป็น UTF-8
         ถ้าไม่ใส่บรรทัดนี้ ข้อความไทยทั้งหน้าจะกลายเป็นตัวอักษรขยะ -->
    <meta charset="UTF-8">
    <!-- viewport : บอกมือถือให้ใช้ความกว้างจริงของหน้าจอ และเริ่มที่อัตราซูม 1 เท่า
         เป็นเงื่อนไข "บังคับ" ที่ทำให้ระบบ Responsive ของ Bootstrap ทำงาน
         ถ้าขาดบรรทัดนี้ มือถือจะย่อหน้าเว็บเดสก์ท็อปลงมาแสดงแทน -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piscine Discovery Rush - แฟ้มสะสมผลงานของเรา</title>
    <!-- ลำดับของ link สำคัญมาก : Bootstrap ก่อน แล้วค่อย style.css
         เพราะ CSS ทำงานตามหลัก "ประกาศทีหลังชนะ" เมื่อความจำเพาะเท่ากัน
         การวาง style.css ไว้หลัง จึงทำให้คลาสที่เขียนเอง (.bg-pink, .text-pink)
         เขียนทับสไตล์เดิมของ Bootstrap ได้
         ถ้าสลับลำดับกัน สีชมพูประจำเว็บจะหายไปทันที -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<!-- custom-bg  : คลาสที่นิยามเองใน style.css ใส่ภาพพื้นหลัง bg.jpg
                   ทับด้วยชั้นสีขาวโปร่งแสง 85% เพื่อให้ตัวหนังสืออ่านง่าย

     inline style ด้านล่างมีไว้ทำให้หน้านี้ "จบในหน้าจอเดียว" :
       height: 100vh      ความสูงเท่ากับความสูงของหน้าจอพอดี
       overflow: hidden   ปิดการเลื่อนหน้าจอ เนื้อหาที่ล้นจะถูกซ่อน
       padding-top: 0     เขียนทับ body { padding-top: 75px } ใน style.css
                          ซึ่งมีไว้เผื่อที่ให้ Navbar แต่หน้าแรกไม่มี Navbar
                          จึงไม่ต้องเว้นที่

     เหตุที่เขียนเป็น inline style : มีลำดับความสำคัญสูงกว่าไฟล์ CSS ภายนอกเสมอ
     จึงการันตีว่าเขียนทับ padding-top ได้แน่นอน -->
<body class="custom-bg" style="min-height: 100vh; padding-top: 0;">

    <!-- ===== บล็อกที่ 1 : ข้อความต้อนรับ =====
         container     กล่องหลักของ Bootstrap จำกัดความกว้างและจัดกึ่งกลางอัตโนมัติ
         text-center   จัดข้อความทั้งหมดในกล่องให้อยู่กึ่งกลาง
         mt-5 mb-5 pt-5  ระยะห่างระดับ 5 (3rem) ดันหัวข้อลงมาจากขอบบนเพื่อความสมดุล
         display-4     ขนาดตัวอักษรแบบ Display ใหญ่กว่า h1 ปกติ ใช้กับหัวเรื่องเด่น
         text-pink     คลาสที่นิยามเอง สี #ff758c ซึ่งเป็นสีประจำเว็บไซต์
         lead          ทำให้ย่อหน้าเด่นขึ้น (ตัวใหญ่ขึ้น น้ำหนักเบาลง) เหมาะกับข้อความนำ -->
    <div class="container text-center mt-5 mb-5 pt-5">
        <h1 class="display-4 fw-bold text-pink">ยินดีต้อนรับสู่พื้นที่แสดงผลงานของเรา</h1>
        <p class="lead text-secondary mt-3">Rush Project - Fun With Coding</p>
        <p class="text-secondary">42Bangkok</p>
    </div>

    <!-- ===== บล็อกที่ 2 : การ์ดสมาชิก (หัวใจของหน้าแรก) =====
         เป็นประตูที่พาผู้ใช้ไปยังหน้ารายละเอียดรายบุคคล
         การ์ด 2 ใบเขียนด้วยรูปแบบเดียวกันเป๊ะ ต่างกันแค่ชื่อ รูป และปลายทางของลิงก์ -->
    <div class="container pb-5">
        <!-- ระบบ Grid ของ Bootstrap มีลำดับชั้นบังคับ : container > row > col
             row                     สร้างแถว ภายในทำงานด้วย Flexbox
             justify-content-center  จัดคอลัมน์ให้อยู่กึ่งกลางแถว
                                     จำเป็นเพราะการ์ด 2 ใบกว้างรวมกันแค่ 10 จาก 12 คอลัมน์
                                     ถ้าไม่ใส่ การ์ดจะชิดซ้ายและดูไม่สมดุล -->
        <div class="row justify-content-center mt-4">
            
            <!-- การ์ดใบที่ 1 : phuwprak
                 col-md-5 = หัวใจของการทำ Responsive
                   จอ md ขึ้นไป (>= 768px)  กว้าง 5/12 ส่วน -> การ์ด 2 ใบเรียงข้างกัน
                   จอเล็กกว่านั้น            กว้างเต็ม 12 คอลัมน์ -> การ์ดวางซ้อนกันลงมา -->
            <div class="col-md-5 mb-5 text-center">
                <!-- card        คอมโพเนนต์การ์ดของ Bootstrap (พื้นขาว มุมโค้ง เส้นขอบ)
                     home-card   คลาสที่นิยามเอง เมื่อเอาเมาส์ชี้ การ์ดจะลอยขึ้น 5px พร้อมเงาเข้มขึ้น
                     shadow      เงาขนาดกลาง ทำให้การ์ดดูลอยจากพื้นหลัง
                     border-0    ลบเส้นขอบเดิมของ card ออกทั้ง 4 ด้าน
                     border-top border-pink border-4
                                 เทคนิคสำคัญ : ใส่ขอบกลับมาเฉพาะด้านบน เป็นสีชมพูหนา 4 หน่วย
                                 เกิดเป็น "แถบสีชมพูคาดหัวการ์ด" ที่ใช้ซ้ำตลอดทั้งเว็บไซต์
                     p-4 p-md-5  Responsive padding : จอเล็กเว้น 1.5rem จอ md ขึ้นไปเว้น 3rem -->
                <div class="card home-card text-center shadow border-0 border-top border-pink border-4">
                    <div class="card-body p-4 p-md-5">
                        <h3 class="card-title text-pink fw-bold mb-2">phuwprak</h3>
                        <!-- img-fluid           max-width: 100% ทำให้รูปย่อตามความกว้างการ์ด ไม่ล้นกรอบ
                             d-block mx-auto     จัดรูปให้อยู่กึ่งกลาง
                             max-height: 200px   จำกัดความสูงไม่ให้รูปดันปุ่มตกขอบจอ
                             mix-blend-mode: multiply
                                 เทคนิคน่าสนใจ : สั่งให้สีของรูปคูณกับสีพื้นหลัง
                                 ผลคือพื้นสีขาวของรูปจะกลืนหายไปเหมือนถูกไดคัตมาแล้ว
                                 โดยไม่ต้องแก้ไฟล์ภาพจริง (การ์ดของ tanboonp ไม่ได้ใส่ เพราะรูปไม่มีพื้นขาว) -->
                        <img src="image-phuwprak/profile.png" alt="รูปโปรไฟล์" class="img-fluid d-block mx-auto mb-2 rounded" style="max-height: 200px; mix-blend-mode: multiply;">
                        <!-- ปุ่มที่พาไปยังหน้ารายละเอียด = จุดเชื่อมต่อของทั้งเว็บไซต์
                             href="phuwprak.html"  ใช้ relative path (ชี้ไฟล์ในโฟลเดอร์เดียวกัน)
                                                   ทำให้ย้ายเว็บไปวางที่ไหนก็ยังทำงานได้
                             class="btn"           แปลงลิงก์ให้มีหน้าตาเป็นปุ่ม แต่ยังเป็นแท็ก a
                                                   ซึ่งถูกต้องสำหรับ "ปุ่มที่ทำหน้าที่พาไปหน้าอื่น"
                             btn-lg                ปุ่มขนาดใหญ่ กดง่ายบนมือถือ
                             bg-pink text-white    พื้นไล่เฉดชมพู ตัวอักษรขาว เพื่อให้ตัดกันและอ่านชัด -->
                        <a href="phuwprak.html" class="btn text-white bg-pink btn-lg" style="border: none; border-radius: 8px;">ดูแฟ้มสะสมผลงาน</a>
                    </div>
                </div>
            </div>

            <!-- การ์ดใบที่ 2 : tanboonp
                 โครงสร้างเหมือนการ์ดใบแรกทุกประการ ต่างกันแค่ 3 จุด :
                   1. ชื่อในหัวการ์ด
                   2. ที่อยู่ของรูปโปรไฟล์ (และไม่ได้ใส่ mix-blend-mode)
                   3. ปลายทางของลิงก์ -> tanboonp.html -->
            <div class="col-md-5 mb-5 text-center">
                <div class="card home-card text-center shadow border-0 border-top border-pink border-4">
                    <div class="card-body p-4 p-md-5">
                        <h3 class="card-title text-pink fw-bold mb-2">tanboonp</h3>
                        <img src="image-taboonp/Picture (17).png" alt="รูปโปรไฟล์" class="img-fluid d-block mx-auto mb-2 rounded" style="max-height: 200px;">
                        <a href="tanboonp.html" class="btn text-white bg-pink btn-lg" style="border: none; border-radius: 8px;">ดูแฟ้มสะสมผลงาน</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- โหลด JavaScript ของ Bootstrap
         คำว่า bundle = รวม Popper.js (ไลบรารีจัดตำแหน่งป๊อปอัป) มาให้แล้ว เรียกไฟล์เดียวจบ

         วางไว้ท้าย body ไม่ใช่ใน head เพื่อให้เบราว์เซอร์วาดเนื้อหาให้ผู้ใช้เห็นก่อน
         แล้วค่อยโหลด JavaScript หน้าเว็บจึงแสดงผลเร็วขึ้น

         หน้านี้ไม่ได้โหลด jQuery และ script.js
         เพราะไม่มี section และเลื่อนหน้าจอไม่ได้อยู่แล้ว เอฟเฟกต์ fade-in จึงไม่จำเป็น
         เป็นการตัดสินใจที่ดีเรื่องประสิทธิภาพ ช่วยลดการดาวน์โหลดไฟล์ที่ไม่ได้ใช้ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
